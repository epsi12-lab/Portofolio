<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Domaine Active Directory durci | Captures</title>
    <link rel="icon" href="assets/favicon/favicon.ico">
    <link rel="icon" type="image/png" sizes="32x32" href="assets/favicon/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="assets/favicon/favicon-16x16.png">
    <link rel="apple-touch-icon" sizes="180x180" href="assets/favicon/apple-touch-icon.png">
    <link rel="stylesheet" href="css/style.css">
    <style>
        .gallery-hero {
            padding: 64px 0 28px;
            background: linear-gradient(135deg, var(--white) 0%, #e8f0fb 100%);
        }

        .gallery-header {
            max-width: 760px;
        }

        .gallery-header h1 {
            color: var(--primary-color);
            font-size: 2.4rem;
            margin-bottom: 12px;
        }

        .gallery-header p {
            font-size: 1.05rem;
            color: #555;
        }

        .gallery-actions {
            display: flex;
            flex-wrap: wrap;
            gap: 14px;
            margin-top: 22px;
        }

        .gallery-actions .btn-outline {
            background: var(--white);
        }

        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 24px;
        }

        .gallery-card {
            background: var(--white);
            border-radius: 14px;
            box-shadow: var(--shadow);
            overflow: hidden;
        }

        .gallery-card img {
            width: 100%;
            display: block;
            object-fit: cover;
        }

        .gallery-card figcaption {
            padding: 16px 18px 18px;
            color: var(--text-color);
            font-weight: 600;
        }

        @media (max-width: 768px) {
            .gallery-hero {
                padding-top: 40px;
            }

            .gallery-header h1 {
                font-size: 1.9rem;
            }
        }
    </style>
</head>
<body>
    <section class="gallery-hero">
        <div class="container">
            <div class="gallery-header">
                <h1>Domaine Active Directory durci</h1>
                <p>Captures du lab GNS3 : structure d'annuaire, durcissement par GPO alignées ANSSI et audit des connexions.</p>
                <div class="gallery-actions">
                    <a href="index.html#projects" class="btn btn-outline">Retour au portfolio</a>
                    <a href="https://github.com/epsi12-lab/gns3-active-directory" target="_blank" rel="noopener noreferrer" class="btn">Voir sur GitHub</a>
                </div>
            </div>
        </div>
    </section>

    <section>
        <div class="container">
            <div class="gallery-grid">
                <figure class="gallery-card">
                    <img src="assets/images/gns3-ad/00_topologie_ad.png" alt="Topologie du domaine Active Directory" width="697" height="419" loading="lazy">
                    <figcaption>Topologie du domaine</figcaption>
                </figure>
                <figure class="gallery-card">
                    <img src="assets/images/gns3-ad/05_structure_ou.png" alt="Structure des unités d'organisation" width="980" height="552" loading="lazy">
                    <figcaption>Structure des OU</figcaption>
                </figure>
                <figure class="gallery-card">
                    <img src="assets/images/gns3-ad/10a_admin_controlpanel_ok.png" alt="Accès autorisé pour le compte administrateur" width="1024" height="814" loading="lazy">
                    <figcaption>Admin : accès autorisé</figcaption>
                </figure>
                <figure class="gallery-card">
                    <img src="assets/images/gns3-ad/10b_user_controlpanel_bloque.png" alt="Accès bloqué pour le compte utilisateur" width="1024" height="808" loading="lazy">
                    <figcaption>Utilisateur : accès bloqué</figcaption>
                </figure>
                <figure class="gallery-card">
                    <img src="assets/images/gns3-ad/12_event_4625_echec_connexion.png" alt="Audit Event 4625 : échec de connexion" width="1028" height="807" loading="lazy">
                    <figcaption>Audit Event 4625</figcaption>
                </figure>
            </div>
        </div>
    </section>
</body>
</html>
