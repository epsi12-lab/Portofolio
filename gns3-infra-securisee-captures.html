<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Infrastructure réseau sécurisée | Captures</title>
    <link rel="icon" href="assets/favicon/favicon.ico">
    <link rel="icon" type="image/png" sizes="32x32" href="assets/favicon/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="assets/favicon/favicon-16x16.png">
    <link rel="apple-touch-icon" sizes="180x180" href="assets/favicon/apple-touch-icon.png">
    <link rel="stylesheet" href="css/style.css">
    <style>
        .gallery-hero {
            padding: 64px 0 28px;
            background: linear-gradient(135deg, var(--white) 0%, #e8f0fb 100%);
        }

        .gallery-header {
            max-width: 760px;
        }

        .gallery-header h1 {
            color: var(--primary-color);
            font-size: 2.4rem;
            margin-bottom: 12px;
        }

        .gallery-header p {
            font-size: 1.05rem;
            color: #555;
        }

        .gallery-actions {
            display: flex;
            flex-wrap: wrap;
            gap: 14px;
            margin-top: 22px;
        }

        .gallery-actions .btn-outline {
            background: var(--white);
        }

        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 24px;
        }

        .gallery-card {
            background: var(--white);
            border-radius: 14px;
            box-shadow: var(--shadow);
            overflow: hidden;
        }

        .gallery-card img {
            width: 100%;
            display: block;
            object-fit: cover;
        }

        .gallery-card figcaption {
            padding: 16px 18px 18px;
            color: var(--text-color);
            font-weight: 600;
        }

        @media (max-width: 768px) {
            .gallery-hero {
                padding-top: 40px;
            }

            .gallery-header h1 {
                font-size: 1.9rem;
            }
        }
    </style>
</head>
<body>
    <section class="gallery-hero">
        <div class="container">
            <div class="gallery-header">
                <h1>Infrastructure réseau d'entreprise sécurisée</h1>
                <p>Captures du lab GNS3 : segmentation VLAN, routage OSPF, haute disponibilité VRRP et filtrage pfSense.</p>
                <div class="gallery-actions">
                    <a href="index.html#projects" class="btn btn-outline">Retour au portfolio</a>
                    <a href="https://github.com/epsi12-lab/gns3-infra-securisee" target="_blank" rel="noopener noreferrer" class="btn">Voir sur GitHub</a>
                </div>
            </div>
        </div>
    </section>

    <section>
        <div class="container">
            <div class="gallery-grid">
                <figure class="gallery-card">
                    <img src="assets/images/gns3-infra/00a_topologie_initiale.png" alt="Topologie initiale du lab GNS3" width="651" height="624" loading="lazy">
                    <figcaption>Topologie initiale</figcaption>
                </figure>
                <figure class="gallery-card">
                    <img src="assets/images/gns3-infra/00b_topologie_finale.png" alt="Topologie finale du lab GNS3" width="1040" height="663" loading="lazy">
                    <figcaption>Topologie finale</figcaption>
                </figure>
                <figure class="gallery-card">
                    <img src="assets/images/gns3-infra/15_bascule_ping_trou_puis_reprise.png" alt="Bascule VRRP démontrée par un ping continu" width="825" height="645" loading="lazy">
                    <figcaption>Bascule VRRP démontrée</figcaption>
                </figure>
                <figure class="gallery-card">
                    <img src="assets/images/gns3-infra/31_logs_pfsense_paquets_bloques.png" alt="Logs pfSense montrant des paquets bloqués" width="1032" height="800" loading="lazy">
                    <figcaption>Logs pfSense — paquets bloqués</figcaption>
                </figure>
            </div>
        </div>
    </section>
</body>
</html>
