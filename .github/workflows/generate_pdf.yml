name: Generate CV PDF from LaTeX

on:
  push:
    paths:
      - 'cv/CV_Bruce_Portfolio.tex'
      - '.github/workflows/generate_pdf.yml'
  workflow_dispatch:

jobs:
  generate-pdf:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Compile LaTeX to PDF
        uses: xu-cheng/latex-action@v3
        with:
          root_file: CV_Bruce_Portfolio.tex
          working_directory: cv
          latexmk_use_lualatex: false
          args: -pdf -interaction=nonstopmode -halt-on-error

      - name: Move PDF into place
        run: |
          mkdir -p public/docs
          mv cv/CV_Bruce_Portfolio.pdf public/docs/CV_Bruce_TUMPA_MADILA.pdf

      - name: Commit and Push PDF
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add public/docs/CV_Bruce_TUMPA_MADILA.pdf
          git diff-index --quiet HEAD || git commit -m "Auto-generate PDF from CV LaTeX"
          git push
